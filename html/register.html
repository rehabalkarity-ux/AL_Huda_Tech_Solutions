<body>
    <header>
    <nav>
        <a href="../index.html">
            <img src="../images/logo.png" alt="Al-Huda Tech Solutions Logo">

        <ul>
            <li><a href="../index.html">Home</a></li>

            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="register-section">
        <div class="section-header">
                <p class="section-label">Create Account</p>
                <h1>Register With Us</h1>

                <p>
                     Create your account to connect with Al-Huda Tech Solutions.
                </p>

        <form id="registerForm"action="register.html" method="get">

                <div class="form-group">
                     <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName">
                </div>

                <div class="form-group">

                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" >
                </div>

                 <div class="form-group">

                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" name="password">
                </div>

                <div class="form-group">

                     <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword">
                </div>

                <button type="submit"> Create Account</button>
        </form>
        </div>
    </section>
</main>

<script src="../libraries/jquery.min.js"></script>
